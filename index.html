<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maglite Collection</title>
<meta name="theme-color" content="#16191d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — knurled header band, scrolling content, bottom tab bar; detail and editors open as full-screen sheets */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5dae0; --ink:#16191d; --ink-2:#4e5763; --ink-3:#7b8592;
  --anod:#1d3f73; --anod-ink:#ffffff; --beam:#c77a14; --beam-soft:#f6e7cf;
  --ok:#2f7a4b; --warn:#b5610f; --bad:#b3362c; --etch:#16191d;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121518; --surface:#1b1f24; --surface-2:#22272d; --line:#323941; --ink:#e9ecef; --ink-2:#b0b8c2; --ink-3:#86909c;
  --anod:#6f9ee6; --anod-ink:#0d1622; --beam:#f0a43a; --beam-soft:#3a2c17; --ok:#5fbf84; --warn:#eaa055; --bad:#ec7a70; --etch:#0b0d10; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--etch)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--etch);color:#e8ebef;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 6px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0;line-height:1.1}
.brand small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;color:#9aa4b0;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none;color:inherit}
.btn.primary{background:var(--anod);border-color:var(--anod);color:var(--anod-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.top .btn{background:var(--beam);border-color:var(--beam);color:#1b1205;font-weight:600}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
section.view{padding-block:16px;display:flex;flex-direction:column;gap:16px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.summary div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.summary div:first-child{border-left:0}
.summary b{display:block;font:600 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;cursor:pointer;width:100%}
.thumb{width:84px;height:84px;border-radius:6px;background:var(--surface-2);object-fit:cover;display:block}
.thumb.none{display:grid;place-items:center;color:var(--ink-3);font-size:11px;text-align:center}
.card h3{font-size:19px;line-height:1.15}
.card .serial{font-size:12.5px;color:var(--ink-2);word-break:break-all}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.era{background:var(--beam-soft);border-color:transparent;color:var(--ink);font-family:var(--f-mono);font-size:11px}
.tag.flag{color:var(--warn);border-color:var(--warn);background:transparent}
.tag.st{color:var(--anod);border-color:var(--anod);background:transparent}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-2);background:var(--surface);display:flex;flex-direction:column;gap:12px;align-items:center}
.banner{border:1px solid var(--warn);color:var(--ink);background:var(--beam-soft);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner span{flex:1;min-width:180px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);cursor:pointer;position:relative;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--anod);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.sheet-head h2{flex:1;min-width:0;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery figure{margin:0;flex:0 0 auto;scroll-snap-align:start;position:relative}
.gallery img{height:220px;width:auto;max-width:none;border-radius:8px;display:block;background:var(--surface-2)}
.gallery figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .sp{flex:1}
dl.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:6px 12px;margin:0}
dl.kv dt{color:var(--ink-3);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.serialplate{font:500 20px/1.2 var(--f-mono);letter-spacing:.12em;background:var(--etch);color:#e8ebef;border-radius:6px;padding:8px 12px;display:inline-block;overflow-wrap:anywhere}
details.writeup summary{cursor:pointer;font-weight:600}
details.writeup pre{white-space:pre-wrap;font:13px/1.55 var(--f-body);color:var(--ink-2);margin:8px 0 0}
.note{border-left:3px solid var(--beam);background:var(--beam-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}
.done{text-decoration:line-through;color:var(--ink-3)}
.tl{position:relative;height:46px;margin-top:4px}
.tl .axis{position:absolute;left:0;right:0;top:18px;height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px}
.tl .band{position:absolute;top:14px;height:18px;background:var(--beam);border-radius:3px;opacity:.9}
.tl .band.wu{top:34px;height:6px;background:var(--ink-3);opacity:.6}
.tl .tick{position:absolute;top:0;font:10.5px var(--f-mono);color:var(--ink-3);transform:translateX(-50%)}
.tl .tick::after{content:"";position:absolute;left:50%;top:14px;height:16px;border-left:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.check-inline{display:flex;gap:8px;align-items:center;font-size:14px}
.fs-title{grid-column:1/-1;font:600 17px var(--f-display);margin-top:8px;padding-top:10px;border-top:1px solid var(--line);letter-spacing:.02em}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.feat{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.feat:first-child{border-top:0}
.feat .opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13.5px;cursor:pointer;text-align:left;min-height:36px}
.opt[aria-pressed="true"]{background:var(--anod);border-color:var(--anod);color:var(--anod-ink)}
.opt.odd{border-color:var(--bad);background:transparent;color:var(--bad)}
.result{border-radius:var(--r);padding:14px;background:var(--etch);color:#e8ebef;display:flex;flex-direction:column;gap:6px}
.result .big{font:700 36px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--beam)}
.result .sub{color:#aeb7c2;font-size:13.5px}
.result.conflict .big{color:#ff8a80}
.gtable{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gtable table{border-collapse:collapse;font-size:12.5px;width:100%}
.gtable th,.gtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.gtable th:first-child,.gtable td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.gtable thead th{font:600 12px var(--f-mono);color:var(--ink-2)}
.gtable td.x{color:var(--beam);font-weight:700}
.gtable input[type=checkbox]{width:20px;height:20px}
.gtable input.inp{min-height:32px;padding:4px 6px;font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--anod);border-radius:3px}
.bar .v{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:3ch;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.menu button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.menu button b{font:600 19px var(--f-display)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.csv{width:100%;min-height:160px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.phgrid{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:104px;display:flex;flex-direction:column;gap:4px}
.ph img{width:104px;height:104px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.ph select{font-size:12px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:999px;width:26px;height:26px;cursor:pointer}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px auto;gap:6px;align-items:center}
.edrow .inp{padding:8px 8px}
.lst{display:flex;flex-direction:column;gap:8px}
.lst .item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.lst .item div{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.card,.btn,.opt{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Maglite Collection<small id="hdrsub">Loading…</small></div>
  <button class="btn" id="addBtn" type="button">+ Add torch</button>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="13" height="6" rx="1.5"/><path d="M16 8.5h3.5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H16"/><path d="M6 9v6M8 9v6M10 9v6"/></svg>Collection</button>
  <button type="button" data-tab="date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg>Date it</button>
  <button type="button" data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11"/><circle cx="5" cy="18" r="1.4"/></svg>To check<span class="badge" id="checkBadge" hidden></span></button>
  <button type="button" data-tab="wanted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Wanted</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</div></nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="restoreIn" accept=".zip,application/zip" hidden>

<script src="jszip.min.js"></script>
<script>
"use strict";
const APP_ID="maglite-collection", BACKUP_VERSION=1, NOW=new Date().getFullYear();

/* ================= storage (IndexedDB, on this device) ================= */
const STORES=["torches","wanted","classes","guides","files","meta"];
let _db;
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open("maglite-collection",1);
  r.onupgradeneeded=()=>{ const d=r.result; for(const s of STORES) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); };
  r.onsuccess=()=>{_db=r.result;res(_db)}; r.onerror=()=>rej(r.error); }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=_db.transaction(store,mode); const os=t.objectStore(store); let out; const r=fn(os); if(r) r.onsuccess=()=>{out=r.result}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const dbAll=s=>tx(s,"readonly",os=>os.getAll());
const dbGet=(s,id)=>tx(s,"readonly",os=>os.get(id));
const dbPut=(s,o)=>tx(s,"readwrite",os=>os.put(o));
const dbDel=(s,id)=>tx(s,"readwrite",os=>os.delete(id));
const dbClear=s=>tx(s,"readwrite",os=>os.clear());
const uid=p=>(p||"x")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= built-in starting classes and guides (all editable) ================= */
function defaultGuides(){
  const mk=(id,name,eras,features,serial,notes)=>({id,name,notes:notes||"",eras:eras.map(([from,to,label],i)=>({id:"e"+i,from,to,label})),features:features.map(([fid,label,note,opts])=>({id:fid,label,note:note||"",opts:opts.map(([oid,ol,idx])=>({id:oid,label:ol,eras:idx.map(i=>"e"+i)}))})),serial:serial||{enabled:false,ranges:{}}});
  const D=mk("g-dcell","D-cell (incandescent)",
    [[1979,1979,"1979"],[1980,1980,"1980"],[1981,1986,"1981–86"],[1987,1989,"1987–89"],[1990,1991,"1990–91"],[1992,1995,"1992–95"],[1996,2002,"1996–2002"],[2003,2009,"2003–09"],[2010,2017,"2010–17"],[2018,null,"2018+"]],
    [["serialPrefix","Serial prefix","",[["none","No letter (numbers only)",[0,1,2,3,4]],["D","D in front",[5,6,7,8,9]]]],
     ["focusGrip","Focus grip position","Pre-1992 lights only.",[["low","Low (¼″ gap below head)",[0]],["standard","Standard (level with head)",[1,2,3,4]]]],
     ["gripLength","Grip length","Pre-1992 lights only.",[["standard","Standard (long)",[0,1,2,3]],["reduced","Reduced (short)",[4]]]],
     ["barrelStamp","Barrel stamp (opposite serial)","",[["patenPending","“Paten Pending”",[0,1]],["madeUSA","“Patented Made in U.S.A.”",[2,3,4,5,6]],["patentedUSA","“Patented in U.S.A.”",[7]],["none","No stamp",[8,9]]]],
     ["bezel","Bezel mark","",[["tm","MAG-LITE TM, stamped",[0,1,2]],["r","MAG-LITE ®, stamped",[3]],["rLaser","MAG-LITE ®, laser-etched",[4]],["tmPanther","Panther TM",[5]],["rPanther","Panther ®",[6,7,8]],["large","Panther ®, large wide MAGLITE logo",[9]]]],
     ["retainer","Switch retainer","",[["alRing","Aluminium ring",[0,1,2,3]],["plRing","Plastic ring",[4]],["clip","Retaining clip",[5,6,7,8,9]]]],
     ["screws","Switch screws","1992+ switches.",[["allen","Allen / hex",[5,6,7]],["torx","Torx",[8,9]]]],
     ["diameter","Barrel outside diameter","",[["1.66","1.66″ (pipe, pre-1992)",[0,1,2,3,4]],["1.55","1.55″ (extruded, 1992+)",[5,6,7,8,9]]]]],
    {enabled:true,ranges:{
      "2":{e0:[1,18000],e1:[18000,70000],e2:[70000,700000],e3:[700000,1400000],e4:[1400000,3000000]},
      "3":{e0:[1,22000],e1:[35000,130000],e2:[130000,1000000],e3:[1000000,2000000],e4:[2000000,4100000]},
      "4":{e0:[1,11000],e1:[11000,82000],e2:[82000,700000],e3:[700000,1000000],e4:[1800000,3000000]},
      "5":{e0:[1,14000],e1:[14000,65000],e2:[65000,300000],e3:[300000,800000],e4:[300000,800000]},
      "6":{e0:[1,5000],e1:[5000,30000],e2:[74000,190000],e3:[190000,300000],e4:[300000,500000]},

/* ================= dating engine ================= */
function runDating(g,marks,serial,cells){
  const order=g.eras.map(e=>e.id); const sets={};
  for(const f of g.features){ const v=marks&&marks[f.id]; if(!v) continue; const o=f.opts.find(o=>o.id===v); if(o) sets[f.id]=new Set(o.eras); }
  let serialNote=null;
  if(g.serial&&g.serial.enabled&&serial&&/^\d{6,9}$/.test(String(serial).trim())){
    const s=String(serial).trim(), c=s[0], n=+s.slice(1), tbl=g.serial.ranges[c];
    if(tbl&&(!cells||+cells===+c)){ const hit=new Set(); for(const [eid,r] of Object.entries(tbl)){ if(r&&r[0]!=null&&r[1]!=null&&n>=r[0]&&n<=r[1]) hit.add(eid); }
      if(hit.size){ sets.__serial=hit; serialNote=`Serial ${n.toLocaleString("en-AU")} (${c}-cell) falls in ${order.filter(e=>hit.has(e)).map(e=>g.eras.find(x=>x.id===e).label).join(" / ")}.`; }
      else serialNote=`Serial ${n.toLocaleString("en-AU")} (${c}-cell) is outside every range in this guide, so it was not used.`;
    } else if(tbl&&cells&&+cells!==+c) serialNote=`First digit ${c} doesn't match a ${cells}-cell light, so the serial was not used.`;
  }
  const keys=Object.keys(sets);
  const inter=ks=>{ let r=order.slice(); for(const k of ks) r=r.filter(e=>sets[k].has(e)); return r; };
  const eras=inter(keys); const odd=[];
  if(!eras.length&&keys.length>1) for(const k of keys) if(inter(keys.filter(x=>x!==k)).length) odd.push(k);
  const sel=eras.map(id=>g.eras.find(e=>e.id===id));
  const from=sel.length?Math.min(...sel.map(e=>e.from)):null;
  const open=sel.some(e=>e.to==null);
  const to=sel.length&&!open?Math.max(...sel.map(e=>e.to)):null;
  return {eras,from,to,open,odd,used:keys.filter(k=>k!=="__serial").length,serialUsed:!!sets.__serial,serialNote};
}
const featLabel=(g,k)=>k==="__serial"?"serial range":(g.features.find(f=>f.id===k)||{}).label||k;
function eraSpan(g,ids){ const sel=g.eras.filter(e=>ids.includes(e.id)); if(!sel.length) return "—"; const open=sel.some(e=>e.to==null); return fmtRange(Math.min(...sel.map(e=>e.from)),open?null:Math.max(...sel.map(e=>e.to)),open); }

function timeline(from,to,wf,wt,open){

function readForm(){
  const t=S.sheet.draft, f=$("#editForm"); if(!f) return t; const fd=new FormData(f);
  const num=k=>{ const v=fd.get(k); return v===""||v==null?null:Number(v); };
  for(const k of ["classId","model","partNo","colour","serial","nickname","status","notes","acqDate","acqType","source","location","orderNo","boughtWith","datingSource","datingNotes","light","bulb","switchType","battery","mods","working","grade","originality","packaging","conditionNotes","valueDate","valueSource","writeup"]) t[k]=(fd.get(k)??"").toString().trim();
  for(const k of ["cells","price","myFrom","myTo","wuFrom","wuTo","valueLow","valueHigh"]) t[k]=num(k);
  t.acqDateApprox=fd.get("acqDateApprox")==="on"; t.priceApprox=fd.get("priceApprox")==="on"; t.myOpen=fd.get("myOpen")==="on";
  t.missingParts=(fd.get("missingParts")||"").split(",").map(s=>s.trim()).filter(Boolean);
  t.markings=t.markings||{}; f.querySelectorAll("[data-mark]").forEach(s=>{ if(s.value) t.markings[s.dataset.mark]=s.value; else delete t.markings[s.dataset.mark]; });
  f.querySelectorAll("[data-phtag]").forEach(s=>{ t.photos[+s.dataset.phtag].tag=s.value; });
  return t;
}
async function saveTorch(){
  const t=readForm(); const isNew=!S.sheet.id; if(isNew) t.id=uid("t");
  if(S.sheet.removedFiles) for(const fid of S.sheet.removedFiles){ if(!S.torches.some(x=>x.id!==t.id&&[...(x.photos||[]),...(x.attachments||[])].some(p=>p.id===fid))) await dbDel("files",fid); }
  t.updatedAt=new Date().toISOString();
  await dbPut("torches",t); await reload(); closeSheet(); toast(isNew?"Torch added":"Saved"); askPersist();
  if(isNew){ S.tab="collection"; render(); }
}
async function deleteTorch(id){ const t=S.torches.find(x=>x.id===id); for(const p of [...(t.photos||[]),...(t.attachments||[])]) await dbDel("files",p.id); await dbDel("torches",id); await reload(); closeSheet(); toast("Torch deleted"); }
async function resizeImage(file){ const bmp=await createImageBitmap(file); const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)); }
async function addPhotos(files){ readForm(); const st=$("#upStat"); let n=0;
  for(const f of files){ try{ if(st) st.textContent=`Adding ${++n} of ${files.length}…`; const b=await resizeImage(f); const id=uid("f"); await dbPut("files",{id,blob:b,type:"image/jpeg",name:id+".jpg"}); S.sheet.draft.photos.push({id,tag:S.sheet.draft.photos.length?"Other":"Overall"}); }catch(e){ toast("A photo couldn't be read."); } }
  drawEdit(); }
async function addAttachment(file){ readForm(); const id=uid("f"); await dbPut("files",{id,blob:file,type:file.type||"application/octet-stream",name:file.name}); (S.sheet.draft.attachments=S.sheet.draft.attachments||[]).push({id,name:file.name}); drawEdit(); }

/* ---------- Date it ---------- */
function viewDateIt(){
  if(!S.guides.length) return `<section class="view"><div class="empty">No dating charts yet. Build one under More → Dating charts.</div></section>`;
  const ds=S.dateState&&S.guides.some(g=>g.id===S.dateState.g)?S.dateState:(S.dateState={g:S.guides[0].id,marks:{},serial:"",cells:"",torchId:""});
  const g=S.guides.find(x=>x.id===ds.g); const r=runDating(g,ds.marks,ds.serial,ds.cells?+ds.cells:null);
  const torches=S.torches.filter(t=>guideOf(t)&&guideOf(t).id===g.id);
  const res=!(r.used||r.serialUsed)?`<div class="result"><span class="lbl" style="color:#aeb7c2">Result</span><div class="big" style="color:#e8ebef">Pick what you see</div><div class="sub">Tick the features on the torch. Leave anything you can't see as “Not sure”.</div>${r.serialNote?`<div class="sub">${esc(r.serialNote)}</div>`:""}</div>`
    : r.eras.length?`<div class="result"><span class="lbl" style="color:#aeb7c2">Matches</span><div class="big">${fmtRange(r.from,r.to,r.open)}</div><div class="sub">${r.eras.map(e=>esc(g.eras.find(x=>x.id===e).label)).join(" · ")} — from ${r.used} feature${r.used===1?"":"s"}${r.serialUsed?" and the serial":""}.</div>${r.serialNote?`<div class="sub">${esc(r.serialNote)}</div>`:""}</div>`
    : `<div class="result conflict"><span class="lbl" style="color:#aeb7c2">No single era fits</span><div class="big">Mixed parts?</div><div class="sub">${r.odd.length?`Any one of these disagrees with the rest: ${r.odd.map(k=>esc(featLabel(g,k))).join(", ")}.`:"Several features disagree. Check each one again."}</div>${r.serialNote?`<div class="sub">${esc(r.serialNote)}</div>`:""}</div>`;
  return `<section class="view">
    <div class="chips">${S.guides.map(x=>`<button type="button" class="chip" data-dg="${esc(x.id)}" aria-pressed="${x.id===g.id}">${esc(x.name)}</button>`).join("")}</div>
    <div class="panel"><div class="form">
      <div class="field"><label for="dtTorch">Load a torch from the collection</label><select id="dtTorch"><option value="">— Start blank —</option>${torches.map(t=>`<option value="${esc(t.id)}"${ds.torchId===t.id?" selected":""}>${esc(label(t))} · ${esc(t.serial||"no serial")}</option>`).join("")}</select></div>
      ${g.serial&&g.serial.enabled?`<div class="field"><label for="dtSerial">Serial (numbers only)</label><input id="dtSerial" style="font-family:var(--f-mono)" value="${esc(ds.serial)}" inputmode="numeric" placeholder="e.g. 40854663"></div>`:""}
    </div></div>
    ${res}${timeline(r.from,r.to,null,null,r.open)}
    <div class="panel">${g.features.length?g.features.map(f=>`<div class="feat"><div><b>${esc(f.label)}</b>${f.note?` <span class="muted small">${esc(f.note)}</span>`:""}</div><div class="opts"><button type="button" class="opt" data-fk="${esc(f.id)}" data-fv="" aria-pressed="${!ds.marks[f.id]}">Not sure</button>${f.opts.map(o=>`<button type="button" class="opt${r.odd.includes(f.id)&&ds.marks[f.id]===o.id?" odd":""}" data-fk="${esc(f.id)}" data-fv="${esc(o.id)}" aria-pressed="${ds.marks[f.id]===o.id}">${esc(o.label)}<span class="muted" style="font-size:11.5px;display:block;font-family:var(--f-mono)">${esc(eraSpan(g,o.eras))}</span></button>`).join("")}</div></div>`).join(""):`<span class="muted">This chart has no features yet. Add them under More → Dating charts.</span>`}</div>
    ${ds.torchId&&r.eras.length&&(r.used||r.serialUsed)?`<button type="button" class="btn primary" data-savedate>Save ${fmtRange(r.from,r.to,r.open)} and markings to this torch</button>`:""}
    ${ds.torchId&&!r.eras.length&&r.used?`<button type="button" class="btn" data-savemarks>Save markings only</button>`:""}
  </section>`;
}
async function saveDating(withRange){
  const ds=S.dateState, t=S.torches.find(x=>x.id===ds.torchId); if(!t) return; const g=S.guides.find(x=>x.id===ds.g);
  const r=runDating(g,ds.marks,ds.serial,ds.cells?+ds.cells:null); const n=clone(t); n.markings={...ds.marks};
  if(withRange){ n.myFrom=r.from; n.myTo=r.open?null:r.to; n.myOpen=r.open; n.datingSource=r.serialUsed&&r.used?"Chart + serial range":r.serialUsed?"Serial range":"Dating chart"; }
  n.updatedAt=new Date().toISOString(); await dbPut("torches",n); await reload(); toast(withRange?"Date and markings saved":"Markings saved"); render();
}

const backMore=`<div><button type="button" class="btn ghost" data-more="">← More</button></div>`;
function barsOf(map,unit){ const e=Object.entries(map); const max=Math.max(1,...e.map(x=>x[1])); return `<div class="bars">${e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="v">${unit==="$"?money(v):v}</span></div>`).join("")}</div>`; }
function viewStats(){
  const own=S.torches.filter(isOwned); const cnt=fn=>own.reduce((m,t)=>{const k=fn(t); m[k]=(m[k]||0)+1; return m;},{}); const desc=o=>Object.fromEntries(Object.entries(o).sort((a,b)=>b[1]-a[1]));
  const dec={}; own.forEach(t=>{ const k=t.myFrom==null?"Undated":Math.floor((t.myTo&&!t.myOpen?Math.round((t.myFrom+t.myTo)/2):t.myFrom)/10)*10+"s"; dec[k]=(dec[k]||0)+1; });
  const spend={}; own.forEach(t=>{ if(t.price!=null&&t.price!==""){ const y=(t.acqDate||"").slice(0,4)||"Unknown"; spend[y]=(spend[y]||0)+(+t.price||0);} });
  const priced=own.filter(t=>t.price!=null&&t.price!==""); const paid=priced.reduce((s,t)=>s+(+t.price||0),0);
  return `<section class="view">${backMore}<div class="summary"><div><span class="lbl">Torches</span><b>${own.length}</b></div><div><span class="lbl">Paid</span><b>${money(paid)}</b></div><div><span class="lbl">Avg paid</span><b>${money(priced.length?paid/priced.length:0)}</b></div></div>
  <div class="panel"><h3>By class</h3>${barsOf(desc(cnt(t=>(clsOf(t)||{}).name||"No class")))}</div>
  <div class="panel"><h3>By decade made</h3><p class="muted small" style="margin:0">Midpoint of your production estimate.</p>${barsOf(Object.fromEntries(Object.entries(dec).sort()))}</div>
  <div class="panel"><h3>By colour</h3>${barsOf(desc(cnt(t=>t.colour||"Unknown")))}</div>
  <div class="panel"><h3>Spend by year acquired</h3>${Object.keys(spend).length?barsOf(Object.fromEntries(Object.entries(spend).sort()),"$"):`<span class="muted">No prices recorded.</span>`}</div></section>`;
}
function viewAbout(){
  return `<section class="view">${backMore}<div class="panel"><h3>Where your data lives</h3><p style="margin:0">Everything — torches, photos, receipts, classes and charts — is stored in this browser on this phone. Nothing is sent anywhere. The app works offline once installed.</p>
  <p style="margin:0">Uninstalling the app or clearing Chrome's site data for it deletes the collection. Keep a recent backup file somewhere else (Google Drive, your NAS, email to yourself).</p>

function readGuide(){
  const g=S.sheet.draft, f=$("#gForm"); if(!f) return g;
  f.querySelectorAll("[data-g]").forEach(el=>{ g[el.dataset.g]=el.value; });
  f.querySelectorAll("[data-era]").forEach(el=>{ const e=g.eras[+el.dataset.era]; const k=el.dataset.k; e[k]=k==="label"?el.value.trim():(el.value.trim()===""||isNaN(+el.value)?null:+el.value); });
  f.querySelectorAll("[data-feat]").forEach(el=>{ g.features[+el.dataset.feat][el.dataset.k]=el.value.trim(); });
  f.querySelectorAll("[data-opt]").forEach(el=>{ const [fi,oi]=el.dataset.opt.split(":").map(Number); g.features[fi].opts[oi].label=el.value.trim(); });
  g.features.forEach(ft=>ft.opts.forEach(o=>o.eras=[]));
  f.querySelectorAll("[data-oera]").forEach(el=>{ if(!el.checked) return; const [fi,oi,eid]=el.dataset.oera.split(":"); g.features[+fi].opts[+oi].eras.push(eid); });
  f.querySelectorAll("[data-sr]").forEach(el=>{ const [c,eid]=el.dataset.sr.split(":"); const m=el.value.replace(/[,\s]/g,"").match(/^(\d+)[-–](\d+)$/); if(m) g.serial.ranges[c][eid]=[+m[1],+m[2]]; else delete g.serial.ranges[c][eid]; });
  return g;
}
async function saveGuide(){
  const g=readGuide(); g.name=(g.name||"").trim(); if(!g.name){ toast("Give the chart a name."); return; }
  const bad=g.eras.find(e=>e.from==null); if(bad){ toast("Every era needs a From year."); return; }
  const isNew=!g.id; if(isNew) g.id=uid("g");
  g.features=g.features.filter(f=>f.label||f.opts.length); g.features.forEach(f=>{ f.opts=f.opts.filter(o=>o.label); if(!f.label) f.label="Feature"; });
  g.eras.sort((a,b)=>a.from-b.from||((a.to??9999)-(b.to??9999))); g.eras.forEach(e=>{ if(!e.label) e.label=fmtRange(e.from,e.to,e.to==null); });
  await dbPut("guides",g); await reload(); closeSheet(); toast(isNew?"Chart created — link it to a class under Classes":"Chart saved"); render();
}

function viewBackup(){
  const last=S.meta.lastBackup;
  return `<section class="view">${backMore}
  <div class="panel"><h3>Back up</h3><p style="margin:0">Makes one .zip file with every torch, photo, receipt, class, chart and wanted item. Save it to Google Drive or your NAS, or email it to yourself.</p>
    <div class="muted small">${last?`Last backup: ${fmtDate(last.slice(0,10))}`:"No backup made on this phone yet."}</div>
    <div class="row"><button type="button" class="btn primary" data-backup>Make backup file</button><span class="muted small" id="bkStat"></span></div><div id="bkOut" class="row"></div></div>
  <div class="panel"><h3>Restore</h3><p style="margin:0">Loads a backup file onto this phone. It <b>replaces</b> everything currently in the app. Use it on a new phone, or to undo mistakes.</p>
    <div class="row"><button type="button" class="btn" data-restore>Choose backup file…</button><span class="muted small" id="rsStat"></span></div><div id="rsConfirm"></div></div></section>`;
}
let _backup=null;
async function makeBackup(){
  const st=$("#bkStat"); st.textContent="Packing…";
  const zip=new JSZip(); const files=await dbAll("files"); const manifest=[];
  for(const f of files){ const ext=(f.type==="image/jpeg"?"jpg":f.type==="image/png"?"png":f.type==="application/pdf"?"pdf":(String(f.name||"").split(".").pop()||"bin")).toLowerCase(); const path=`files/${f.id}.${ext}`; zip.file(path,f.blob); manifest.push({id:f.id,type:f.type,name:f.name,path}); }
  const data={app:APP_ID,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),counts:{torches:S.torches.length,files:files.length},classes:S.classes,guides:S.guides,torches:S.torches,wanted:S.wanted,files:manifest};
  zip.file("backup.json",JSON.stringify(data,null,1));
  const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
  const name=`maglite-backup-${new Date().toISOString().slice(0,10)}.zip`;
  _backup={blob,name}; const url=URL.createObjectURL(blob);
  const file=new File([blob],name,{type:"application/zip"});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $("#bkOut").innerHTML=`<a class="btn primary" href="${url}" download="${esc(name)}" data-dlbk>Save to phone</a>${canShare?`<button type="button" class="btn" data-sharebk>Share to Drive / email…</button>`:""}<span class="muted small">${(blob.size/1048576).toFixed(1)} MB · ${S.torches.length} torches · ${files.length} files</span>`;
  st.textContent="";
}
async function markBackedUp(){ S.meta.lastBackup=new Date().toISOString(); await dbPut("meta",{id:"main",...S.meta}); }
let _restore=null;
async function readRestore(file){
  const st=$("#rsStat")||{}; st.textContent="Reading…";
  try{
    const zip=await JSZip.loadAsync(file); const j=zip.file("backup.json"); if(!j) throw new Error("This isn't a Maglite Collection backup (no backup.json inside).");
    const data=JSON.parse(await j.async("string")); if(data.app!==APP_ID) throw new Error("This file is from a different app.");
    _restore={zip,data};
    const html=`<div class="banner" style="margin-top:8px"><span>Backup from ${fmtDate(String(data.exportedAt).slice(0,10))}: ${data.torches.length} torches, ${data.files.length} photos/files, ${data.classes.length} classes, ${data.guides.length} charts. This replaces what's on this phone${S.torches.length?` (${S.torches.length} torches)`:""}.</span><button type="button" class="btn primary sm" data-rsyes>Restore</button><button type="button" class="btn ghost sm" data-rsno>Cancel</button></div>`;
    if($("#rsConfirm")){ $("#rsConfirm").innerHTML=html; st.textContent=""; }
    else { S.tab="more"; S.moreView="backup"; render(); $("#rsConfirm").innerHTML=html; }
  }catch(e){ if($("#rsStat")) $("#rsStat").textContent=""; toast(e.message||"That file couldn't be read."); }
}
async function doRestore(){
  const {zip,data}=_restore; const st=$("#rsStat"); st.textContent="Restoring…";
  for(const s of ["torches","wanted","classes","guides","files"]) await dbClear(s);
  for(const u of Object.values(S.urls)) URL.revokeObjectURL(u); S.urls={};
  let n=0; for(const f of data.files){ const z=zip.file(f.path); if(!z) continue; const b=await z.async("blob"); await dbPut("files",{id:f.id,type:f.type,name:f.name,blob:new Blob([b],{type:f.type})}); if(++n%10===0) st.textContent=`Restoring photos ${n} of ${data.files.length}…`; }
  for(const c of data.classes) await dbPut("classes",c); for(const g of data.guides) await dbPut("guides",g); for(const t of data.torches) await dbPut("torches",t); for(const w of (data.wanted||[])) await dbPut("wanted",w);
  S.meta.lastBackup=data.exportedAt; await dbPut("meta",{id:"main",...S.meta});
  _restore=null; await reload(); askPersist(); S.tab="collection"; S.dateState=null; render(); toast(`Restored ${data.torches.length} torches`);
}

/* ================= events ================= */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,a[data-dlbk]"); if(!b) return; const d=b.dataset;
  if(d.tab){ S.tab=d.tab; if(d.tab==="more") S.moreView=null; render(); scrollTo(0,0); return; }
  if(d.cls){ S.cls=d.cls; render(); return; }
  if(d.open){ openDetail(d.open); return; }
  if("close" in d){ const k=S.sheet&&S.sheet.kind; closeSheet(); if(k==="class"||k==="guide") render(); return; }
  if(d.edit){ openEdit(d.edit); return; }
  if("add" in d){ openEdit(null); return; }
  if("cancel" in d){ const id=S.sheet&&S.sheet.id; if(S.sheet&&S.sheet.newFiles) for(const f of S.sheet.newFiles) await dbDel("files",f); closeSheet(); if(id) openDetail(id); return; }
  if("save" in d){ b.disabled=true; try{ await saveTorch(); }catch(err){ toast("Couldn't save: "+(err&&err.message||err)); b.disabled=false; } return; }
  if(d.rmph!=null){ readForm(); const [p]=S.sheet.draft.photos.splice(+d.rmph,1); (S.sheet.removedFiles=S.sheet.removedFiles||[]).push(p.id); drawEdit(); return; }
  if(d.rmatt!=null){ readForm(); const [a]=S.sheet.draft.attachments.splice(+d.rmatt,1); (S.sheet.removedFiles=S.sheet.removedFiles||[]).push(a.id); drawEdit(); return; }
  if(d.rmchk!=null){ readForm(); S.sheet.draft.checks.splice(+d.rmchk,1); drawEdit(); return; }
  if("addchk" in d){ const v=$("#newChk").value.trim(); if(!v) return; readForm(); (S.sheet.draft.checks=S.sheet.draft.checks||[]).push({t:v,done:false}); drawEdit(); return; }
  if("del" in d){ readForm(); S.sheet.confirmDel=true; drawEdit(); return; }
  if("delno" in d){ readForm(); S.sheet.confirmDel=false; drawEdit(); return; }
  if("delyes" in d){ await deleteTorch(S.sheet.id); return; }
  if(d.dateit){ const t=S.torches.find(x=>x.id===d.dateit), g=guideOf(t); closeSheet(); if(!g){ toast("This class has no dating chart. Link one under More → Classes."); return; } S.tab="date"; S.dateState={g:g.id,marks:{...(t.markings||{})},serial:/^\d{6,9}$/.test(t.serial||"")?t.serial:"",cells:cellsOf(t)||"",torchId:t.id}; render(); scrollTo(0,0); return; }
  if(d.dg){ S.dateState={g:d.dg,marks:{},serial:"",cells:"",torchId:""}; render(); return; }
  if(d.fk!=null){ if(d.fv) S.dateState.marks[d.fk]=d.fv; else delete S.dateState.marks[d.fk]; render(); return; }
  if("savedate" in d){ await saveDating(true); return; }
  if("savemarks" in d){ await saveDating(false); return; }
  if(d.more!=null){ S.moreView=d.more||null; render(); scrollTo(0,0); if(d.more==="about") fillStoreInfo(); return; }
  if(d.moreGo){ S.tab="more"; S.moreView=d.moreGo; render(); scrollTo(0,0); return; }
  if("copycsv" in d){ const ta=$("#csvText"); try{ await navigator.clipboard.writeText(ta.value); toast("CSV copied"); }catch{ ta.focus(); ta.select(); toast("Text selected — copy it from here"); } return; }
  if(d.wgot){ const x=clone(S.wanted.find(w=>w.id===d.wgot)); x.got=!x.got; await dbPut("wanted",x); await reload(); render(); return; }
  if(d.wdel){ await dbDel("wanted",d.wdel); await reload(); render(); toast("Removed from wanted list"); return; }
  if(d.cledit!=null){ openClassEdit(d.cledit||null); return; }
  if("clsave" in d){ await saveClass(); return; }
  if("cldel" in d){ S.sheet.confirmDel=true; drawClassEdit(); return; }
  if("cldelno" in d){ S.sheet.confirmDel=false; drawClassEdit(); return; }
  if("cldelyes" in d){ await dbDel("classes",S.sheet.draft.id); await reload(); closeSheet(); render(); toast("Class deleted"); return; }
  if(d.gedit){ openGuideEdit(d.gedit); return; }
  if("gnew" in d){ openGuideEdit(null); return; }
  if("gsave" in d){ await saveGuide(); return; }
  if("addera" in d){ const g=readGuide(); const last=g.eras[g.eras.length-1]; g.eras.push({id:uid("e"),from:last&&last.to!=null?last.to+1:null,to:null,label:""}); drawGuideEdit(); return; }
  if(d.rmera!=null){ const g=readGuide(); const [e1]=g.eras.splice(+d.rmera,1); g.features.forEach(f=>f.opts.forEach(o=>o.eras=o.eras.filter(x=>x!==e1.id))); Object.values(g.serial.ranges).forEach(r=>delete r[e1.id]); drawGuideEdit(); return; }
  if("addfeat" in d){ const g=readGuide(); g.features.push({id:uid("ft"),label:"",note:"",opts:[{id:uid("o"),label:"",eras:[]}]}); drawGuideEdit(); return; }
  if(d.rmfeat!=null){ const g=readGuide(); g.features.splice(+d.rmfeat,1); drawGuideEdit(); return; }
  if(d.addopt!=null){ const g=readGuide(); g.features[+d.addopt].opts.push({id:uid("o"),label:"",eras:[]}); drawGuideEdit(); return; }
  if(d.rmopt){ const g=readGuide(); const [fi,oi]=d.rmopt.split(":").map(Number); g.features[fi].opts.splice(oi,1); drawGuideEdit(); return; }
  if("addsr" in d){ const g=readGuide(); const c=$("#newCells").value.trim(); if(!c) return; g.serial.ranges[c]=g.serial.ranges[c]||{}; drawGuideEdit(); return; }
  if(d.rmsr){ const g=readGuide(); delete g.serial.ranges[d.rmsr]; drawGuideEdit(); return; }
  if("gdel" in d){ readGuide(); S.sheet.confirmDel=true; drawGuideEdit(); return; }
  if("gdelno" in d){ readGuide(); S.sheet.confirmDel=false; drawGuideEdit(); return; }
  if("gdelyes" in d){ await dbDel("guides",S.sheet.draft.id); await reload(); closeSheet(); render(); toast("Chart deleted"); return; }
  if("backup" in d){ b.disabled=true; try{ await makeBackup(); }catch(err){ toast("Backup failed: "+(err&&err.message||err)); } b.disabled=false; return; }
  if("dlbk" in d){ setTimeout(markBackedUp,500); toast("Backup saved — check your Downloads"); return; }
  if("sharebk" in d){ try{ await navigator.share({files:[new File([_backup.blob],_backup.name,{type:"application/zip"})],title:"Maglite Collection backup"}); await markBackedUp(); toast("Backup shared"); }catch(err){ if(err&&err.name!=="AbortError") toast("Sharing didn't work — use Save to phone."); } return; }
  if("restore" in d){ $("#restoreIn").click(); return; }
  if("rsyes" in d){ b.disabled=true; try{ await doRestore(); }catch(err){ toast("Restore failed: "+(err&&err.message||err)); } return; }
  if("rsno" in d){ _restore=null; $("#rsConfirm").innerHTML=""; return; }
});
$("#addBtn").addEventListener("click",()=>openEdit(null));
document.addEventListener("input",e=>{
  if(e.target.id==="search"){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const s=$("#search"); s.focus(); try{s.setSelectionRange(pos,pos);}catch{} }
  if(e.target.id==="dtSerial"){ S.dateState.serial=e.target.value.replace(/\s/g,""); clearTimeout(S._st); S._st=setTimeout(()=>{ render(); const s=$("#dtSerial"); if(s){ s.focus(); const l=s.value.length; s.setSelectionRange(l,l);} },400); }
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="sort"){ S.sort=el.value; render(); }
  if(el.id==="dtTorch"){ const t=S.torches.find(x=>x.id===el.value); S.dateState={g:S.dateState.g,marks:t?{...(t.markings||{})}:{},serial:t&&/^\d{6,9}$/.test(t.serial||"")?t.serial:"",cells:t?cellsOf(t)||"":"",torchId:t?t.id:""}; render(); }
  if(el.dataset.chk){ await toggleCheck(el.dataset.chk,+el.dataset.i,el.checked); }
  if(el.id==="f_classId"){ readForm(); drawEdit(); }
  if(el.id==="phIn"&&el.files.length){ const fs=[...el.files]; const before=new Set((S.sheet.draft.photos||[]).map(p=>p.id)); await addPhotos(fs); (S.sheet.newFiles=S.sheet.newFiles||[]).push(...S.sheet.draft.photos.filter(p=>!before.has(p.id)).map(p=>p.id)); }
  if(el.id==="attIn"&&el.files.length){ await addAttachment(el.files[0]); const a=S.sheet.draft.attachments; (S.sheet.newFiles=S.sheet.newFiles||[]).push(a[a.length-1].id); }
  if(el.id==="restoreIn"&&el.files.length){ await readRestore(el.files[0]); el.value=""; }
  if(el.dataset.serialon!=null){ const g=readGuide(); g.serial.enabled=el.checked; drawGuideEdit(); }
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="wantForm") return; e.preventDefault(); const fd=new FormData(e.target); const model=(fd.get("w_model")||"").trim(); if(!model) return; const tg=fd.get("w_target");
  await dbPut("wanted",{id:uid("w"),model,colour:(fd.get("w_colour")||"").trim(),target:tg===""?null:Number(tg),priority:fd.get("w_priority"),notes:(fd.get("w_notes")||"").trim(),got:false,addedAt:new Date().toISOString()});
  await reload(); render(); toast("Added to wanted list");
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.sheet){ closeSheet(); render(); } });

/* ================= boot ================= */
async function reload(){ [S.torches,S.wanted,S.classes,S.guides]=await Promise.all(["torches","wanted","classes","guides"].map(dbAll)); const m=await dbGet("meta","main"); S.meta=m?(({id,...r})=>r)(m):{}; }
(async()=>{
  try{ await openDB(); }catch(e){ $("#main").innerHTML=`<section class="view"><div class="empty">This browser can't store data for the app (private mode or storage blocked). Open it in normal Chrome.</div></section>`; return; }
  await reload();
  if(!S.classes.length&&!S.guides.length){ for(const g of defaultGuides()) await dbPut("guides",g); for(const c of defaultClasses()) await dbPut("classes",c); await reload(); }
  render();
  if("serviceWorker" in navigator && location.protocol!=="file:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
</html>
